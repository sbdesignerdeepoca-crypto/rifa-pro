<style>
:root{--bg:#f4f3f1;--card:#fff;--ink:#17171b;--muted:#777781;--accent:#c2a04a;--accent2:#81651f;--line:#e7e5e2;--green:#21845c;--amber:#b76d19;--red:#bf3446}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;font-weight:700;background:var(--accent);color:#fff}button:hover{filter:brightness(.96)}button.secondary{background:#efedf0;color:var(--ink)}button.danger{background:#fff0f1;color:var(--red)}button.small{padding:7px 10px;font-size:13px}.top{background:#101014;color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:850;letter-spacing:.2px}.brand span{color:#c2a04a}.wrap{max-width:1060px;margin:26px auto;padding:0 16px}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 18px #19121a08}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.stack{display:grid;gap:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.split{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:var(--muted)}h1,h2,h3,p{margin:0 0 10px}h1{font-size:clamp(25px,4vw,38px);line-height:1.15}h2{font-size:22px}.field{display:grid;gap:5px}.field label{font-size:13px;font-weight:700}.field input,.field textarea{width:100%;padding:11px 12px;border:1px solid #d8d6d4;border-radius:9px;background:white}.field textarea{min-height:82px;resize:vertical}.tabs{display:flex;gap:8px;margin-bottom:16px}.tab{background:#e9e6e8;color:var(--ink)}.tab.active{background:var(--ink);color:white}.hidden{display:none!important}.notice{padding:11px 13px;border-radius:10px;background:#fff3df;color:#805217}.success{background:#e7f6ee;color:#176443}.error{background:#ffedef;color:#9f2434}.ticket-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:7px;margin:14px 0}.ticket{background:#edf7f1;color:#197348;padding:9px 2px;border-radius:8px;font-weight:700;text-align:center}.ticket.selected{background:var(--accent);color:#17171b}.ticket.reserved{background:#ffe4b8;color:#7a4a05}.ticket.paid{background:#dddde1;color:#666;cursor:not-allowed}.hero{background:#17171b;color:white;padding:clamp(22px,5vw,46px);border-radius:18px;margin-bottom:16px}.hero p{color:#dedde3}.hero .badge{background:#2b2a31;color:#e2c56f}.photos{display:flex;gap:10px;overflow:auto;margin:10px 0 16px}.photos img{width:150px;height:135px;object-fit:cover;border-radius:12px;background:#ece9e7}.photo-previews{display:flex;gap:10px;flex-wrap:wrap}.photo-preview{display:grid;gap:3px;max-width:110px;font-size:12px;color:var(--muted);overflow:hidden}.photo-preview img{width:100px;height:80px;object-fit:cover;border-radius:8px}.photo-preview span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.campaign{display:flex;flex-direction:column;gap:8px}.badge{font-size:12px;border-radius:20px;background:#f2edf0;padding:4px 9px;display:inline-block}.reservation{border-top:1px solid var(--line);padding:12px 0}.copy{background:#28272e}.footer{text-align:center;color:var(--muted);padding:30px 10px;font-size:12px}.support-box{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:0 0 16px}.support-box a{font-weight:750;text-decoration:none}.support-button{display:inline-block;background:#f3ead0;color:#5e4815;padding:9px 13px;border-radius:9px;white-space:nowrap}.auth{max-width:430px;margin:8vh auto}.stat{font-size:25px;font-weight:800}.price{font-weight:800;color:var(--accent);font-size:20px}.linkbox{word-break:break-all;color:#755}a{color:var(--accent2)}
</style></head>
<body><header class="top"><div class="brand">Rifa <span>Pro</span></div><div id="topActions"></div></header><main class="wrap"><div id="toast" class="hidden"></div><section id="publicView" class="hidden"></section><section id="authView" class="panel auth hidden"><h1>Seu painel de rifas</h1><p class="muted">Entre ou crie sua conta para administrar campanhas.</p><div class="tabs"><button id="loginTab" class="tab active">Entrar</button><button id="signupTab" class="tab">Criar conta</button></div><form id="authForm" class="stack"><div class="field"><label for="email">E-mail</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label for="password">Senha</label><input id="password" type="password" required minlength="8" autocomplete="current-password"></div><button id="authSubmit">Entrar</button><div id="authMessage" class="muted"></div><button type="button" id="forgotBtn" class="secondary">Esqueci minha senha</button></form><form id="newPassForm" class="stack hidden"><h2>Criar nova senha</h2><div class="field"><label for="newPass">Nova senha (mínimo 8 caracteres)</label><input id="newPass" type="password" required minlength="8" autocomplete="new-password"></div><button id="newPassBtn">Salvar nova senha</button><div id="newPassMsg" class="muted"></div></form></section><section id="adminView" class="hidden"></section></main><footer class="footer">Rifa Pro · Gestão simples para suas campanhas</footer>
<script>
const SUPABASE_URL='https://hwussryznzedbaebadpp.supabase.co';
const SUPABASE_KEY='sb_publishable_ZMLeSEkOgXmYLyQsRhL2TA_Giy-Bq_q';
// Endereço do site publicado (ex.: https://seusite.github.io/rifa-pro/). Usado nos links públicos.
const PUBLIC_SITE_URL='https://raw.githack.com/sbdesignerdeepoca-crypto/rifa-pro/main/index.html';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);let user=null,authMode='login',selected=new Set(),currentRaffle=null;
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n||0)}
function slugify(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Math.random().toString(36).slice(2,6)}
function say(text,type='notice'){let e=$('#toast');e.className='notice '+(type==='success'?'success':type==='error'?'error':'');e.textContent=text;setTimeout(()=>e.classList.add('hidden'),5000)}
function siteBase(){if(PUBLIC_SITE_URL)return PUBLIC_SITE_URL.replace(/[?#].*$/,'');const h=location.hostname;if(/^https?:$/.test(location.protocol)&&h&&h!=='localhost'&&h!=='127.0.0.1')return location.origin+location.pathname;return ''}
function publicUrl(slug){const b=siteBase();return b?b+'?r='+encodeURIComponent(slug):''}
const STATUS_PT={draft:'Rascunho',published:'Publicada',closed:'Encerrada'};
function show(which){['publicView','authView','adminView'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==which))}
async function start(){if(/type=recovery/.test(location.hash))return;const slug=new URLSearchParams(location.search).get('r');if(slug){show('publicView');await loadPublic(slug);return}const {data:{user:u}}=await sb.auth.getUser();user=u;$('#topActions').innerHTML=user?'<button id="signout" class="secondary">Sair</button>':'';$('#signout')?.addEventListener('click',async()=>{await sb.auth.signOut();location.reload()});if(user){show('adminView');await loadAdmin()}else{show('authView')}}
$('#loginTab').onclick=()=>setAuthMode('login');$('#signupTab').onclick=()=>setAuthMode('signup');function setAuthMode(m){authMode=m;$('#loginTab').classList.toggle('active',m==='login');$('#signupTab').classList.toggle('active',m==='signup');$('#authSubmit').textContent=m==='login'?'Entrar':'Criar conta'}
function authErr(m=''){if(/invalid login/i.test(m))return 'E-mail ou senha incorretos. Se esqueceu a senha, toque em "Esqueci minha senha".';if(/not confirmed/i.test(m))return 'Confirme seu e-mail antes de entrar (veja sua caixa de entrada e o spam).';if(/already registered/i.test(m))return 'Este e-mail já tem conta. Use "Entrar".';if(/rate limit|security purposes/i.test(m))return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';if(/fetch|network/i.test(m))return 'Sem conexão. Verifique sua internet.';return 'Não foi possível concluir: '+m}
$('#forgotBtn').onclick=async()=>{const email=$('#email').value.trim(),b=$('#forgotBtn');if(!email){$('#authMessage').textContent='Digite seu e-mail acima e toque de novo em "Esqueci minha senha".';$('#email').focus();return}b.disabled=true;b.textContent='Enviando…';const base=siteBase();const {error}=await sb.auth.resetPasswordForEmail(email,base?{redirectTo:base}:{});b.disabled=false;b.textContent='Esqueci minha senha';$('#authMessage').textContent=error?authErr(error.message):'Pronto! Enviamos um link para '+email+'. Abra o e-mail (veja também o spam) e toque no link para criar a nova senha.'};
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){show('authView');$('#authForm').classList.add('hidden');$('.tabs').classList.add('hidden');$('#newPassForm').classList.remove('hidden')}});
$('#newPassForm').onsubmit=async e=>{e.preventDefault();const b=$('#newPassBtn');b.disabled=true;b.textContent='Salvando…';const {error}=await sb.auth.updateUser({password:$('#newPass').value});b.disabled=false;b.textContent='Salvar nova senha';if(error){$('#newPassMsg').textContent=authErr(error.message);return}$('#newPassMsg').textContent='Senha alterada! Entrando…';setTimeout(()=>location.replace(location.pathname),1200)};
$('#authForm').onsubmit=async e=>{e.preventDefault();const btn=$('#authSubmit'),label=btn.textContent;btn.disabled=true;btn.textContent='Aguarde…';const email=$('#email').value.trim(),password=$('#password').value;let r;try{r=authMode==='login'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password})}catch(err){r={error:err}}btn.disabled=false;btn.textContent=label;if(r.error){$('#authMessage').textContent=authErr(r.error.message);return}if(authMode==='signup'&&!r.data.session){$('#authMessage').textContent='Conta criada. Confirme o e-mail para entrar.';return}location.reload()};
async function loadAdmin(){const {data:raffles,error}=await sb.from('raffles').select('*').order('created_at',{ascending:false});if(error){say('Não foi possível carregar campanhas: '+error.message,'error');return}$('#adminView').innerHTML=`<div class="split" style="margin-bottom:16px"><div><h1>Painel de campanhas</h1><p class="muted">Gerencie rifas, números e reservas.</p></div><button id="newRaffle">+ Nova rifa</button></div><div class="grid" id="campaigns"></div><div id="editor" class="hidden"></div><div id="resPane" class="hidden"></div>`;const box=$('#campaigns');if(!raffles.length)box.innerHTML='<div class="panel"><h2>Comece sua primeira rifa</h2><p class="muted">Crie a campanha e compartilhe o link público com seus clientes.</p></div>';for(const r of raffles){const {count}=await sb.from('raffle_tickets').select('*',{count:'exact',head:true}).eq('raffle_id',r.id).eq('status','available');const {count:paid}=await sb.from('raffle_tickets').select('*',{count:'exact',head:true}).eq('raffle_id',r.id).eq('status','paid');box.insertAdjacentHTML('beforeend',`<article class="card campaign"><div class="split"><h2>${esc(r.title)}</h2><span class="badge">${esc(STATUS_PT[r.status]||r.status)}</span></div>${r.status!=='published'?`<div class="notice">${r.status==='draft'?'Esta rifa está em <b>rascunho</b>: o link público só funciona depois de publicar.':'Esta rifa está <b>encerrada</b>: o link público não abre mais.'} <button class="small" data-pub="${r.id}">Publicar agora</button></div>`:''}${publicUrl(r.slug)?'':'<div class="notice">O link para os clientes ainda não está disponível. Abra o Rifa Pro pelo endereço do site, não pelo arquivo salvo no celular.</div>'}<div class="muted">${money(r.ticket_price)} por número · ${count||0} disponíveis · ${paid||0} pagos</div><div class="row"><button class="small copy" data-copy="${esc(publicUrl(r.slug))}" ${publicUrl(r.slug)?'':'disabled style="opacity:.45;cursor:not-allowed"'}>Copiar link</button><button class="small secondary" data-edit="${r.id}">Editar</button><button class="small secondary" data-res="${r.id}">Reservas</button><button class="small danger" data-del="${r.id}">Excluir</button></div>${publicUrl(r.slug)?`<div class="linkbox">${esc(publicUrl(r.slug))}</div>`:''}</article>`)}$('#newRaffle').onclick=()=>editRaffle();box.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const r=raffles.find(x=>publicUrl(x.slug)===b.dataset.copy);if(!b.dataset.copy){say('Link indisponível: abra o app pelo site publicado.','error');return}if(r&&r.status!=='published'){say('Publique a rifa antes de compartilhar o link.','error');return}try{await navigator.clipboard.writeText(b.dataset.copy);say('Link copiado.','success')}catch{prompt('Copie o link:',b.dataset.copy)}});box.querySelectorAll('[data-pub]').forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent='Publicando…';const {error}=await sb.from('raffles').update({status:'published'}).eq('id',b.dataset.pub);if(error){say('Não foi possível publicar: '+error.message,'error');b.disabled=false;b.textContent='Publicar agora';return}say('Rifa publicada. O link já funciona.','success');await loadAdmin()});box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editRaffle(raffles.find(r=>r.id===b.dataset.edit)));box.querySelectorAll('[data-res]').forEach(b=>b.onclick=()=>loadReservations(b.dataset.res));box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteRaffle(b.dataset.del))}
async function optimizePrizePhoto(file){if(!file.type.startsWith('image/'))throw new Error('Escolha somente arquivos de imagem.');const bitmap=await createImageBitmap(file);const scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Não consegui preparar uma das fotos.')),'image/jpeg',.82));return blob}
async function uploadRafflePhotos(files){const urls=[];for(let i=0;i<files.length;i++){const blob=await optimizePrizePhoto(files[i]);const path=`${user.id}/${crypto.randomUUID()}.jpg`;const {error}=await sb.storage.from('raffle-prizes').upload(path,blob,{contentType:'image/jpeg',cacheControl:'3600',upsert:false});if(error)throw error;urls.push(sb.storage.from('raffle-prizes').getPublicUrl(path).data.publicUrl);$('#photoUploadStatus').textContent=`Enviando foto ${i+1} de ${files.length}…`}return urls}
function editRaffle(r=null){const e=$('#editor');e.classList.remove('hidden');e.innerHTML=`<div class="panel" style="margin-top:18px"><h2>${r?'Editar campanha':'Criar campanha'}</h2><form id="raffleForm" class="grid"><input type="hidden" id="rid" value="${r?.id||''}"><div class="field"><label>Nome da rifa</label><input id="title" required value="${esc(r?.title||'')}"></div><div class="field"><label>Valor por número (R$)</label><input id="price" type="number" min="0" step="0.01" required value="${r?.ticket_price??10}"></div><div class="field"><label>Quantidade de números</label><input id="quantity" type="number" min="1" max="10000" required value="${r?'':'100'}" ${r?'disabled':''}></div><div class="field"><label>WhatsApp com DDI/DDD</label><input id="whatsapp" placeholder="5541999999999" value="${esc(r?.whatsapp_phone||'')}"></div><div class="field"><label>Chave Pix (opcional)</label><input id="pix" value="${esc(r?.pix_key||'')}"></div><div class="field"><label>Nome de quem recebe o Pix</label><input id="pixReceiver" placeholder="Nome do titular da chave" value="${esc(r?.pix_receiver_name||'')}"></div><div class="field"><label>Data do sorteio</label><input id="draw" type="datetime-local" value="${r?.draw_date?new Date(new Date(r.draw_date).getTime()-new Date(r.draw_date).getTimezoneOffset()*60000).toISOString().slice(0,16):''}"></div><div class="field" style="grid-column:1/-1"><label>Descrição do prêmio</label><textarea id="description">${esc(r?.description||'')}</textarea></div><div class="field" style="grid-column:1/-1"><label>Fotos do prêmio</label><textarea id="photos" placeholder="Cole uma URL por linha (opcional)">${esc((r?.prize_photos||[]).filter(x=>!x.startsWith('data:')).join('\n'))}</textarea><div class="row"><button type="button" id="choosePhotos" class="secondary">Escolher fotos da galeria</button><span class="muted">Até 5 fotos no total</span></div><input id="photoFiles" class="hidden" type="file" accept="image/*" multiple><div id="photoPreviews" class="photo-previews"></div><div id="photoUploadStatus" class="muted" aria-live="polite"></div></div><div class="field"><label>Status</label><select id="status"><option value="draft">Rascunho</option><option value="published">Publicada</option><option value="closed">Encerrada</option></select></div><div class="row" style="align-self:end"><button id="saveRaffle">Salvar</button><button type="button" id="cancelEdit" class="secondary">Fechar</button></div></form></div>`;$('#status').value=r?.status||'published';$('#cancelEdit').onclick=()=>e.classList.add('hidden');const fileInput=$('#photoFiles'),preview=$('#photoPreviews');$('#choosePhotos').onclick=()=>fileInput.click();fileInput.onchange=()=>{const files=[...fileInput.files];const urls=$('#photos').value.split('\n').map(x=>x.trim()).filter(Boolean);if(urls.length+files.length>5){say('Escolha no máximo 5 fotos, contando os links.','error');fileInput.value='';preview.innerHTML='';return}preview.innerHTML=files.map((f,i)=>`<div class="photo-preview"><img src="${URL.createObjectURL(f)}" alt="Prévia ${i+1}"><span>${esc(f.name)}</span></div>`).join('')};$('#raffleForm').onsubmit=async ev=>{ev.preventDefault();const photoInput=$('#photoFiles'),files=[...(photoInput.files||[])],photoUrls=$('#photos').value.split('\n').map(x=>x.trim()).filter(Boolean);if(photoUrls.length+files.length>5){say('Escolha no máximo 5 fotos, contando os links.','error');return}const saveBtn=$('#saveRaffle');saveBtn.disabled=true;saveBtn.textContent='Salvando…';try{if(files.length){$('#photoUploadStatus').textContent='Enviando fotos…';photoUrls.push(...await uploadRafflePhotos(files));$('#photoUploadStatus').textContent='Fotos enviadas.'}const data={owner_id:user.id,title:$('#title').value.trim(),ticket_price:Number($('#price').value),whatsapp_phone:$('#whatsapp').value.replace(/\D/g,''),pix_key:$('#pix').value.trim(),pix_receiver_name:$('#pixReceiver').value.trim(),description:$('#description').value.trim(),prize_photos:photoUrls.slice(0,5),status:$('#status').value,draw_date:$('#draw').value?new Date($('#draw').value).toISOString():null};if(!r){data.slug=slugify(data.title);const {data:created,error}=await sb.from('raffles').insert(data).select().single();if(error){say(error.message,'error');return}const n=Number($('#quantity').value),tickets=Array.from({length:n},(_,i)=>({raffle_id:created.id,ticket_number:i+1}));for(let i=0;i<tickets.length;i+=500){const {error:te}=await sb.from('raffle_tickets').insert(tickets.slice(i,i+500));if(te){say('Campanha criada, mas houve erro ao gerar números: '+te.message,'error');return}}}else{const {error}=await sb.from('raffles').update(data).eq('id',r.id);if(error){say(error.message,'error');return}}say('Campanha salva.','success');await loadAdmin()}catch(err){say('Não foi possível salvar: '+(err?.message||err),'error')}finally{saveBtn.disabled=false;saveBtn.textContent='Salvar'}}}
async function deleteRaffle(id){if(!confirm('Excluir esta rifa e seus números e reservas?'))return;const {error}=await sb.from('raffles').delete().eq('id',id);if(error){say(error.message,'error');return}say('Rifa excluída.','success');await loadAdmin()}
async function loadReservations(id){const p=$('#resPane');p.classList.remove('hidden');p.innerHTML='<div class="panel" style="margin-top:18px">Carregando reservas…</div>';const {data,error}=await sb.from('raffle_reservations').select('*,raffles(title,whatsapp_phone)').eq('raffle_id',id).order('created_at',{ascending:false});if(error){say(error.message,'error');return}p.innerHTML=`<div class="panel" style="margin-top:18px"><div class="split"><h2>Reservas</h2><button id="closeRes" class="secondary">Fechar</button></div>${data.length?data.map(x=>`<div class="reservation"><div class="split"><b>${esc(x.customer_name)} · ${esc(x.customer_phone)}</b><span class="badge">${esc(x.status)}</span></div><div>Números: ${esc(x.ticket_numbers.join(', '))} · ${money(x.total_amount)}</div>${x.status==='reserved'?`<button class="small" data-paid="${x.id}">Marcar como pago</button><button class="small danger" data-cancel="${x.id}">Cancelar reserva</button>`:''}</div>`).join(''):'<p class="muted">Ainda não há reservas.</p>'}</div>`;$('#closeRes').onclick=()=>p.classList.add('hidden');p.querySelectorAll('[data-paid]').forEach(b=>b.onclick=()=>setReservationStatus(b.dataset.paid,'paid',id));p.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>setReservationStatus(b.dataset.cancel,'cancelled',id))}
async function setReservationStatus(id,status,rid){const {error}=await sb.from('raffle_reservations').update({status}).eq('id',id);if(error){say(error.message,'error');return}say(status==='paid'?'Pagamento confirmado.':'Reserva cancelada.','success');await loadReservations(rid);await loadAdmin()}
async function loadPublic(slug){const {data:r,error}=await sb.from('raffles').select('*').eq('slug',slug).eq('status','published').maybeSingle();if(error){$('#publicView').innerHTML=`<div class="panel"><h1>Não foi possível abrir a rifa</h1><p class="muted">Verifique sua internet e tente de novo.</p><button onclick="location.reload()">Tentar de novo</button></div>`;console.error(error);return}if(!r){$('#publicView').innerHTML='<div class="panel"><h1>Rifa não encontrada</h1><p class="muted">Ela pode ainda não ter sido publicada ou já ter sido encerrada. Confira o link ou fale com quem compartilhou.</p></div>';return}currentRaffle=r;const {data:tickets,error:te}=await sb.from('raffle_tickets').select('ticket_number,status').eq('raffle_id',r.id).order('ticket_number');if(te){say(te.message,'error');return}const photos=(r.prize_photos||[]).map(x=>`<img src="${esc(x)}" alt="Foto do prêmio" loading="lazy">`).join('');const supportInfo=`<div class="support-box"><span><b>Precisa de ajuda?</b> Fale com nosso suporte.</span><a class="support-button" href="https://wa.me/5541987060683?text=Ol%C3%A1%2C%20preciso%20de%20ajuda%20com%20a%20rifa." target="_blank" rel="noopener">WhatsApp</a></div>`;const pixInfo=(r.pix_key||r.pix_receiver_name)?`<section class="panel" style="margin-bottom:16px"><h2>Pagamento via Pix</h2>${r.pix_receiver_name?`<p><b>Recebedor:</b> ${esc(r.pix_receiver_name)}</p>`:''}${r.pix_key?`<div class="row"><span><b>Chave Pix:</b> ${esc(r.pix_key)}</span><button id="copyPix" type="button" class="small copy">Copiar chave</button></div>`:''}</section>`:'';$('#publicView').innerHTML=`<section class="hero"><span class="badge">Rifa pública</span><h1>${esc(r.title)}</h1><p>${esc(r.description)}</p><div class="price">${money(r.ticket_price)} por número</div>${r.draw_date?`<p>Sorteio: ${new Date(r.draw_date).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</p>`:''}</section>${photos?`<div class="photos">${photos}</div>`:''}${pixInfo}${supportInfo}<div class="panel"><div class="split"><div><h2>Escolha seus números</h2><p class="muted">Verde disponível · amarelo reservado · cinza pago</p></div><b id="selectedCount">0 selecionados</b></div><form id="reserveForm" class="stack" style="margin-top:14px"><div class="grid"><div class="field"><label for="customerName">Seu nome</label><input id="customerName" required minlength="2" autocomplete="name"></div><div class="field"><label for="customerPhone">WhatsApp com DDD</label><input id="customerPhone" type="tel" required minlength="10" placeholder="(41) 99999-9999" autocomplete="tel"></div></div><div class="row"><div class="field" style="width:min(180px,100%)"><label for="randomQuantity">Quantos números?</label><input id="randomQuantity" type="number" min="1" max="300" value="1" inputmode="numeric"></div><button type="button" id="randomPick" class="secondary">Escolher aleatoriamente</button></div><div class="row"><button type="submit">Reservar números</button></div><div class="ticket-grid">${tickets.map(t=>`<button type="button" class="ticket ${t.status==='reserved'?'reserved':t.status==='paid'?'paid':''}" data-number="${t.ticket_number}" ${t.status!=='available'?'disabled':''}>${String(t.ticket_number).padStart(2,'0')}</button>`).join('')}</div><div id="selectionSummary" class="muted">Selecione seus números na grade ou escolha uma quantidade aleatória.</div><div class="row"><button type="submit">Reservar números</button></div></form><div id="reserveResult"></div></div><div class="footer">Ao reservar, seus números ficam sujeitos à confirmação do responsável pela rifa.</div>`;$('#copyPix')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(r.pix_key);say('Chave Pix copiada.','success')}catch{say('Não foi possível copiar a chave Pix.','error')}});const availableTickets=tickets.filter(t=>t.status==='available').map(t=>t.ticket_number),randomQuantity=$('#randomQuantity');randomQuantity.max=String(Math.min(availableTickets.length,300));$('#randomPick').onclick=()=>{const quantity=Number(randomQuantity.value);if(!Number.isInteger(quantity)||quantity<1){say('Digite quantos números quer escolher.','error');return}if(quantity>availableTickets.length){say(`Há somente ${availableTickets.length} números disponíveis.`,'error');return}const pool=[...availableTickets];for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}selected.clear();pool.slice(0,quantity).forEach(n=>selected.add(n));$('#publicView').querySelectorAll('[data-number]').forEach(b=>b.classList.toggle('selected',selected.has(Number(b.dataset.number))));updateSummary(r)};$('#publicView').querySelectorAll('[data-number]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.number);if(!selected.has(n)&&selected.size>=300){say('O limite é de 300 números por reserva.','error');return}selected.has(n)?selected.delete(n):selected.add(n);b.classList.toggle('selected',selected.has(n));updateSummary(r)});$('#reserveForm').onsubmit=e=>reserve(e,r);}
function updateSummary(r){$('#selectedCount').textContent=`${selected.size} selecionado${selected.size===1?'':'s'}`;$('#selectionSummary').textContent=selected.size?`Números ${[...selected].sort((a,b)=>a-b).join(', ')} · Total ${money(selected.size*r.ticket_price)}`:'Selecione um ou mais números.'}
async function reserve(e,r){e.preventDefault();if(!selected.size){say('Escolha pelo menos um número.','error');return}if(selected.size>300){say('O limite é de 300 números por reserva.','error');return}const btn=e.submitter;btn.disabled=true;btn.textContent='Reservando…';const body={raffle_id:r.id,customer_name:$('#customerName').value.trim(),customer_phone:$('#customerPhone').value.replace(/\D/g,''),ticket_numbers:[...selected].sort((a,b)=>a-b)};const {data,error}=await sb.functions.invoke('reserve-raffle-tickets',{body});btn.disabled=false;btn.textContent='Reservar números';if(error){let details=null;try{if(error.context?.json)details=await error.context.json()}catch{}const message=error.context?.status===409?'Algum número acabou de ser reservado. Atualize a página e escolha outros.':(details?.error||error.message);say(message,'error');return}const res=data;selected.clear();const msg=encodeURIComponent(`Olá! Reservei números ${body.ticket_numbers.join(', ')} da ${r.title}. Meu nome: ${body.customer_name}. Total: ${money(body.ticket_numbers.length*r.ticket_price)}. Reserva: ${res.reservation_id}`);await loadPublic(r.slug);$('#reserveResult').innerHTML=`<div class="notice success" style="margin-top:12px">Reserva enviada! O responsável confirmará o pagamento pelo WhatsApp.</div>${r.whatsapp_phone?`<a href="https://wa.me/${encodeURIComponent(r.whatsapp_phone)}?text=${msg}" target="_blank" rel="noopener"><button style="margin-top:10px">Continuar no WhatsApp</button></a>`:''}`}
// The login and logout handlers reload the page after changing auth state.
// Do not reload from onAuthStateChange: INITIAL_SESSION can arrive while
// start() is still resolving getUser(), causing a reload loop on mobile.
start();
</script></body></html>
